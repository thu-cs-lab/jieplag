[package]
name = "jieplag_core"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["all_langs"]

cpp = ["dep:clang"]
javascript = ["dep:boa_ast", "dep:boa_parser", "dep:boa_interner"]
lua = ["dep:full_moon"]
python = ["dep:rustpython-parser"]
rust = ["dep:proc-macro2"]
sql = ["dep:sqlparser"]
verilog = ["dep:verilog-lang"]

all_langs = ["cpp", "javascript", "lua", "python", "rust", "sql", "verilog"]


[dependencies]

anyhow = "1.0.103"
once_cell = "1.21.4"
bitvec = "1.1.1"
regex = "1.12.4"
rkr-gst = "0.1.2"
tempfile = "3.27.0"
walkdir = "2.5.0"
serde = { version = "1.0.228", features = ["derive"] }
env_logger = "0.11.11"
log = "0.4.33"
adler32 = "1.2.0"
html-escape = "0.2.13"
clap = { version = "4.6.1", features = ["derive"] }

# Cpp
clang = { version = "2.0.0", optional = true }
# JavaScript
boa_ast = { version = "0.21.1", optional = true }
boa_parser = { version = "0.21.1", optional = true }
boa_interner = { version = "0.21.1", optional = true }
# Lua
full_moon = { version = "2.2.0", optional = true }
# Python
rustpython-parser = { version = "0.4.0", features = ["full-lexer"], optional = true }
# Rust
proc-macro2 = { version = "1.0.106", features = ["span-locations"], optional = true }
# SQL
sqlparser = { version = "0.62.0", optional = true }
# Verilog
verilog-lang = { git = "https://github.com/jiegec/verilog-lang", optional = true }
