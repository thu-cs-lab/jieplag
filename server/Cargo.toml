[package]
name = "server"
version = "0.1.0"
authors = ["Jiajie Chen <c@jia.je>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]

jieplag_core = { path = "../core" }
api = { path = "../api" }

actix = "0.13.5"
actix-http = "3.13.1"
actix-web = "4.14.0"
actix-cors = "0.7.1"
actix-rt = "2.11.0"
actix-session = { version = "0.11.0", features = ["cookie-session"] }
diesel = { version = "2.3.10", features = ["postgres", "r2d2", "chrono"] }
diesel_migrations = "2.3.2"
log = "0.4.33"
anyhow = "1.0.103"
html-escape = "0.2.13"
serde = { version = "1.0.228", features = ["derive"] }
reqwest = { version = "0.13.4", features = ["blocking", "json"] }
ring = "0.17.14"
uuid = { version = "1.23.4", features = ["v4"] }
clang = "2.0.0"
env_logger = "0.11.11"
dotenv = "0.15.0"
clap = { version = "4.6.1", features = ["derive"] }
rayon = "1.12.0"
